<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sera Otomasyon</title>
  <meta name="description" content="Sera günlük iş takibi ve Excel raporlama">
  <meta name="theme-color" content="#1f6f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sera">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="ust-bar">
    <div class="marka">
      <img src="icons/icon-192.png" alt="" width="28" height="28">
      <span>Sera Otomasyon</span>
    </div>
  </header>

  <main id="ekran" aria-live="polite"></main>

  <nav id="sekmeler" class="sekmeler" aria-label="Bölümler"></nav>

  <div id="katman" class="katman" hidden>
    <div class="alt-sayfa" role="dialog" aria-modal="true" aria-labelledby="sayfa-baslik">
      <div class="tutamak"></div>
      <div class="alt-sayfa-ust">
        <h3 id="sayfa-baslik"></h3>
        <button class="ikon-btn" data-kapat aria-label="Kapat">
          <svg class="ik" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="sayfa-govde" class="alt-sayfa-govde"></div>
    </div>
  </div>

  <div id="yukleniyor" class="yukleniyor" hidden><div class="donen"></div><span>Hazırlanıyor…</span></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
